server {
    listen 18080;
    listen [::]:18080;
    server_name disarm.qdev.run;
    server_tokens off;
    absolute_redirect off;

    root /srv/www/disarm.qdev.run;
    index index.html;
    location = /runtime-health.json {
        auth_request off;
        proxy_pass http://127.0.0.1:18081/auth/health;
        add_header Cache-Control "no-store" always;
    }

    # Server-level protection also covers static JSON, CSS, JS and direct-origin traffic.
    auth_request /_disarm_auth_check;
    error_page 401 = @disarm_login;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    location = /_disarm_auth_check {
        internal;
        auth_request off;
        proxy_pass http://127.0.0.1:18081/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /auth/login {
        auth_request off;
        proxy_pass http://127.0.0.1:18081/auth/login;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Referer $http_referer;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /auth/logout {
        auth_request off;
        proxy_pass http://127.0.0.1:18081/auth/logout;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /login {
        auth_request off;
        try_files /login.html =404;
        add_header Cache-Control "no-store" always;
    }
    location = /login.html { internal; auth_request off; }
    location = /assets/disarm-login.css { auth_request off; try_files $uri =404; add_header Cache-Control "public, max-age=3600"; }
    location = /assets/disarm-login.js { auth_request off; try_files $uri =404; add_header Cache-Control "public, max-age=3600"; }
    location = /assets/ui-locales.js { auth_request off; try_files $uri =404; add_header Cache-Control "public, max-age=3600"; }
    location = /assets/i18n-runtime.js { auth_request off; try_files $uri =404; add_header Cache-Control "public, max-age=3600"; }

    location @disarm_login {
        auth_request off;
        return 302 /login?next=$request_uri;
    }

    location = /.well-known/avds-adoption.json {
        try_files $uri =404;
        default_type application/json;
        add_header Cache-Control "public, max-age=300";
        add_header Access-Control-Allow-Origin "*";
    }

    location ~ /\. { return 404; }
    location = /README.md { return 404; }
    location = /data/externalgroups.json { return 404; }
    location ^~ /docs/ { return 404; }
    location ^~ /scripts/ { return 404; }
    location ^~ /ops/ { return 404; }
    location = /requirements-release.txt { return 404; }
    location ~* \.bak(\.|$) { return 404; }

    location / { try_files $uri $uri/ =404; }

    location ~* \.json$ {
        add_header Cache-Control "public, max-age=300";
        add_header Access-Control-Allow-Origin "*";
    }
    location ~* \.(js|css)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
    location ~* \.(jpg|jpeg|png|svg|ico|webp)$ { expires 7d; }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;
}
