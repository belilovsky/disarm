# disarm.qdev.run — generated by qdev DISARM module deployer
server {
    server_name disarm.qdev.run;

    # AVDS_PORTFOLIO_SPACING_ADAPTER_V1
    location = /avds-spacing-v1.js { alias /var/www/avds-badge-control/v1/spacing.js; default_type application/javascript; add_header Cache-Control "public, max-age=300" always; }
    sub_filter '</body>' '<script defer src="/avds-spacing-v1.js?v=1.1.0"></script></body>';
    server_tokens off;

    location = /.well-known/avds-adoption.json {
        try_files $uri =404;
        default_type application/json;
        add_header Cache-Control "public, max-age=300";
        add_header Access-Control-Allow-Origin "*";
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    root /var/www/disarm.qdev.run;
    index index.html;
    location = /runtime-health.json {
        proxy_pass http://127.0.0.1:18081/auth/health;
        add_header Cache-Control "no-store" always;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    location ~ /\. { return 404; }
    location = /README.md { return 404; }
    location = /data/externalgroups.json { return 404; }
    location ^~ /docs/ { return 404; }
    location ^~ /scripts/ { return 404; }
    location ^~ /ops/ { return 404; }
    location = /requirements-release.txt { return 404; }
    location ~* \.bak(\.|$) { return 404; }

    location /task-api/ {
        # Proxy to legacy task API on task.qdev.run (cross-origin -> same-origin)
        proxy_pass https://task.qdev.run/api/;
        proxy_set_header Host task.qdev.run;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }

    location / {
        # AVDS_PORTFOLIO_SPACING_LOCATION_V1
        sub_filter '</body>' '<script defer src="/avds-spacing-v1.js?v=1.1.0"></script></body>';
        proxy_pass http://187.55.228.239:18080;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
        sub_filter_once on;
        sub_filter '</body>' '<link rel="stylesheet" href="/avds-adoption-badge.css?v=1"><script defer src="/avds-adoption-badge.js?v=1"></script></body>';
    }

    location ~* \.json$ {
        add_header Cache-Control "public, max-age=300";
        add_header Access-Control-Allow-Origin "*";
    }
    location ~* \.(js|css)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
    location ~* \.(jpg|jpeg|png|svg|ico|webp)$ { expires 7d; }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/disarm.qdev.run/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/disarm.qdev.run/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = disarm.qdev.run) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name disarm.qdev.run;
    return 404; # managed by Certbot


}
